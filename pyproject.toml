[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-assistant"
version = "0.1.0"
description = "A modular, local-first personal AI assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlcipher3==0.6.2",
]

[tool.setuptools.packages.find]
where = ["src"]
